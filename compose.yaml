# Full stack: `docker compose up` builds the app, waits for Postgres, runs
# migrations once, then starts the server on http://localhost:3000.
#
# For local development you can instead run only the infrastructure
# (`docker compose up -d db mailhog`) and the app on the host with `pnpm dev`.

services:
  db:
    image: postgres:17-alpine
    container_name: tsnuxt-taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      # Host 5436 -> container 5432. A local Postgres already occupies 5432 (and
      # 5433/5434 are taken by other containers), so this port avoids the clash.
      - '5436:5432'
    volumes:
      - taskflow-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow -d taskflow']
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outgoing mail in development. SMTP on 1025, web inbox on 8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: tsnuxt-taskflow-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # One-shot migration job: applies migrations then exits, so the app never runs
  # them at boot (no race across instances). Built from the same source image.
  migrate:
    build:
      context: .
      target: builder
    command: ['pnpm', 'db:migrate']
    environment:
      NUXT_DATABASE_URL: postgresql://taskflow:taskflow@db:5432/taskflow
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    container_name: tsnuxt-taskflow-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NUXT_DATABASE_URL: postgresql://taskflow:taskflow@db:5432/taskflow
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-change-me-in-production-32-characters-min}
      NUXT_PUBLIC_APP_NAME: TaskFlow
      NUXT_APP_URL: http://localhost:3000
      NUXT_MAIL_FROM: TaskFlow <no-reply@taskflow.dev>
      NUXT_SMTP_HOST: mailhog
      NUXT_SMTP_PORT: '1025'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  taskflow-pgdata:
